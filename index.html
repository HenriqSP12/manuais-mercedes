<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuais de Serviço - Mercedes W124 / M104</title>
    <!-- Carregando Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Biblioteca para converter Markdown (texto do Gemini) em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Ajuste para não deixar espaço sobrando no final do balão de chat */
        .msg-bot p:last-child, .msg-user p:last-child { 
            margin-bottom: 0; 
        }

        body { background-color: #f8f9fa; }
        .hero-section {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .pdf-link {
            transition: background-color 0.2s;
        }
        .pdf-link:hover {
            background-color: #e2e8f0;
            cursor: pointer;
        }
        .accordion-button:not(.collapsed) {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
        }
        
        /* Estilos do Mecânico Virtual */
        #chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 1050; }
        #chat-window { width: 350px; height: 500px; display: none; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-radius: 12px; background: #fff; overflow: hidden; }
        #chat-header { background: #1e293b; color: white; padding: 15px; font-weight: bold; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .msg-user { align-self: flex-end; background: #0369a1; color: white; padding: 10px 14px; border-radius: 15px 15px 0 15px; max-width: 85%; font-size: 0.95em; }
        .msg-bot { align-self: flex-start; background: #e2e8f0; color: #1e293b; padding: 10px 14px; border-radius: 15px 15px 15px 0; max-width: 85%; font-size: 0.95em; }
        #chat-input-area { padding: 10px; background: white; border-top: 1px solid #dee2e6; display: flex; gap: 8px; }
        .btn-robot { background: #e0f2fe; color: #0369a1; border: none; transition: 0.2s; }
        .btn-robot:hover { background: #bae6fd; color: #0284c7; }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="fw-bold"><i class="bi bi-tools"></i> Acervo Técnico Mercedes-Benz</h1>
            <p class="lead text-light">Documentação de Serviço - Chassis W124 & Motor M104</p>
            
            <!-- Barra de Pesquisa -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-8">
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" 
                               placeholder="Digite uma peça, arquivo ou código (ex: 03-310, Virabrequim)..." 
                               onkeyup="gerenciarVisualizacao()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Container Principal -->
    <div class="container pb-5">
        
        <!-- VISÃO 1: Categorias em Sanfona (Mostrada por padrão) -->
        <div class="accordion shadow-sm" id="visaoCategorias">
            <!-- Gerado via JavaScript -->
        </div>

        <!-- VISÃO 2: Resultados da Pesquisa (Oculta por padrão) -->
        <div id="visaoPesquisa" class="d-none">
            <h4 class="mb-3 text-secondary">Resultados da busca:</h4>
            <div class="list-group shadow-sm" id="listaResultados">
                <!-- Gerado via JavaScript -->
            </div>
        </div>

        <!-- Mensagem de "Nenhum resultado" -->
        <div id="noResults" class="text-center mt-5 d-none">
            <i class="bi bi-emoji-frown fs-1 text-muted"></i>
            <h4 class="text-muted mt-2">Nenhum manual encontrado.</h4>
        </div>
    </div>

    <!-- Chatbot Flutuante -->
    <div id="chat-widget">
        <div id="chat-window">
            <div id="chat-header" class="d-flex justify-content-between align-items-center">
                <span><i class="bi bi-robot"></i> Mecânico Virtual (IA)</span>
                <button class="btn-close btn-close-white" onclick="toggleChat()"></button>
            </div>
            <div id="chat-messages">
                <div class="msg-bot">Olá! Escolha um manual clicando no ícone do robô e faça-me uma pergunta sobre ele.</div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" class="form-control" placeholder="Ex: Qual o torque do parafuso?" onkeypress="if(event.key === 'Enter') enviarMensagem()">
                <button class="btn btn-primary" onclick="enviarMensagem()"><i class="bi bi-send"></i></button>
            </div>
        </div>
        <button id="chat-toggle-btn" class="btn btn-primary rounded-circle shadow d-flex justify-content-center align-items-center" style="width: 60px; height: 60px; float: right; margin-top: 10px;" onclick="toggleChat()">
            <i class="bi bi-robot fs-3"></i>
        </button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let manuais = [];
        let manuaisAgrupados = {};

        // 1. Carrega o banco de dados JSON
        fetch('catalogo.json')
            .then(response => response.json())
            .then(data => {
                manuais = data;
                agruparPorCategoria();
                renderizarCategorias();
            })
            .catch(error => console.error("Erro ao carregar o catálogo:", error));

        // 2. Agrupa a lista de manuais por categoria
        function agruparPorCategoria() {
            manuaisAgrupados = manuais.reduce((grupos, manual) => {
                const cat = manual.categoria;
                if (!grupos[cat]) {
                    grupos[cat] = [];
                }
                grupos[cat].push(manual);
                return grupos;
            }, {});
        }

        // 3. Desenha a "Sanfona" de categorias na tela
        function renderizarCategorias() {
            const container = document.getElementById('visaoCategorias');
            container.innerHTML = '';
            
            const categoriasOrdenadas = Object.keys(manuaisAgrupados).sort();

            categoriasOrdenadas.forEach((categoria, index) => {
                const listaManuais = manuaisAgrupados[categoria];
                const idCollapse = `collapse-${index}`;
                
                let itensHTML = '';
                listaManuais.forEach(pdf => {
                    itensHTML += `
                        <a href="${pdf.caminho}" target="_blank" class="list-group-item list-group-item-action pdf-link d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge bg-secondary me-2">${pdf.nome_arquivo}</span>
                                <span class="text-dark">${pdf.titulo_descritivo}</span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <button class="btn btn-sm btn-robot shadow-sm" onclick="event.preventDefault(); abrirChatParaPdf('${pdf.caminho}', '${pdf.titulo_descritivo}')" title="Analisar com IA">
                                    <i class="bi bi-stars"></i> IA
                                </button>
                                <i class="bi bi-file-earmark-pdf text-danger fs-5"></i>
                            </div>
                        </a>
                    `;
                });

                const categoriaHTML = `
                    <div class="accordion-item border-0 border-bottom">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-semibold fs-5 text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#${idCollapse}">
                                <i class="bi bi-folder2-open me-3 text-primary"></i> 
                                ${categoria} 
                                <span class="badge bg-primary rounded-pill ms-auto me-3">${listaManuais.length}</span>
                            </button>
                        </h2>
                        <div id="${idCollapse}" class="accordion-collapse collapse" data-bs-parent="#visaoCategorias">
                            <div class="accordion-body p-0">
                                <div class="list-group list-group-flush">
                                    ${itensHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', categoriaHTML);
            });
        }

        // 4. Controla o que aparece na tela (Modo Navegação vs Modo Pesquisa)
        function gerenciarVisualizacao() {
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            const visaoCategorias = document.getElementById('visaoCategorias');
            const visaoPesquisa = document.getElementById('visaoPesquisa');
            const listaResultados = document.getElementById('listaResultados');
            const noResults = document.getElementById('noResults');

            if (termo === "") {
                visaoCategorias.classList.remove('d-none');
                visaoPesquisa.classList.add('d-none');
                noResults.classList.add('d-none');
                return;
            }

            visaoCategorias.classList.add('d-none');
            visaoPesquisa.classList.remove('d-none');
            
            const filtrados = manuais.filter(m => m.tags.includes(termo));
            listaResultados.innerHTML = '';

            if (filtrados.length === 0) {
                visaoPesquisa.classList.add('d-none');
                noResults.classList.remove('d-none');
            } else {
                noResults.classList.add('d-none');
                filtrados.forEach(pdf => {
                    listaResultados.insertAdjacentHTML('beforeend', `
                        <a href="${pdf.caminho}" target="_blank" class="list-group-item list-group-item-action pdf-link d-flex justify-content-between align-items-center p-3">
                            <div>
                                <div class="small text-primary mb-1"><i class="bi bi-tag-fill"></i> ${pdf.categoria}</div>
                                <span class="badge bg-secondary me-2">${pdf.nome_arquivo}</span>
                                <span class="text-dark fw-medium">${pdf.titulo_descritivo}</span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <button class="btn btn-sm btn-robot shadow-sm" onclick="event.preventDefault(); abrirChatParaPdf('${pdf.caminho}', '${pdf.titulo_descritivo}')" title="Analisar com IA">
                                    <i class="bi bi-stars"></i> IA
                                </button>
                                <i class="bi bi-file-earmark-pdf text-danger fs-4"></i>
                            </div>
                        </a>
                    `);
                });
            }
        }

        // 5. Lógica do Mecânico Virtual (IA)
        let pdfAtivoParaChat = "";
        let nomePdfAtivo = "";

        function toggleChat() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
        }

        function abrirChatParaPdf(urlPdf, nomePdf) {
            // Monta o link absoluto para o n8n conseguir descarregar o ficheiro do GitHub Pages
            const linkAbsoluto = window.location.href.split('index.html')[0].replace(/\/$/, '') + '/' + urlPdf;
            
            pdfAtivoParaChat = linkAbsoluto;
            nomePdfAtivo = nomePdf;

            const chatWindow = document.getElementById('chat-window');
            if (chatWindow.style.display !== 'flex') toggleChat();
            
            adicionarMensagemBot(`Manual <br><b>${nomePdf}</b><br> selecionado! O que quer saber sobre ele?`);
        }
        
        async function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const mensagem = input.value.trim();
            if (!mensagem) return;

            if (!pdfAtivoParaChat) {
                adicionarMensagemBot("Por favor, selecione um manual clicando no ícone 'IA' na lista antes de fazer uma pergunta.");
                input.value = "";
                return;
            }

            adicionarMensagemUser(mensagem);
            input.value = "";
            adicionarMensagemBot("<i><i class='bi bi-hourglass-split'></i> A ler o manual...</i>", "loading-msg");

            try {
                // Link oficial de produção do seu n8n Cloud
                const webhookUrl = "https://hsperovano.app.n8n.cloud/webhook/pdf-question"; 

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: mensagem,
                        pdf_url: pdfAtivoParaChat
                    })
                });

                // Lê o pacote JSON enviado pelo n8n
                const data = await response.json(); 
                
                // Extrai apenas o texto que está dentro da chave "answer"
                const respostaLimpa = data.answer || data.text || JSON.stringify(data);

                document.getElementById('loading-msg').remove();
                adicionarMensagemBot(respostaLimpa);

            } catch (error) {
                document.getElementById('loading-msg').remove();
                adicionarMensagemBot("Erro de comunicação com o servidor. O fluxo do n8n está ativo?");
            }
        }

        function adicionarMensagemUser(texto) {
            const painel = document.getElementById('chat-messages');
            painel.insertAdjacentHTML('beforeend', `<div class="msg-user">${texto}</div>`);
            painel.scrollTop = painel.scrollHeight;
        }

        function adicionarMensagemBot(texto, id = "") {
            const painel = document.getElementById('chat-messages');
            
            // Converte o Markdown do Gemini (ex: **negrito**) para HTML.
            // Se for apenas a mensagem de "carregando", não processa.
            const htmlTexto = id === "loading-msg" ? texto : marked.parse(texto);
            
            painel.insertAdjacentHTML('beforeend', `<div class="msg-bot" ${id ? `id="${id}"` : ''}>${htmlTexto}</div>`);
            painel.scrollTop = painel.scrollHeight;
        }
    </script>
</body>
</html>
